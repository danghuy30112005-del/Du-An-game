<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dead Island</title>
<link rel="stylesheet" href="../css/deadisland.css">
</head><body><main>
<div id="stage">
  <canvas id="c"></canvas>
  <h1 id="title">THE DEAD</h1>
  <div id="cap"></div>
  <div id="menu"><button class="btn" id="start">Bắt đầu</button><button class="btn" id="cont" hidden>Tiếp tục</button></div>
  <div id="lv" hidden>
    <h2>Chọn màn chơi</h2>
    <div class="cards">
      <button class="card" id="lv1"><b>MÀN 1</b><span>Castle In Land</span></button>
      <div class="card lock"><b>MÀN 2</b><span>To be continued...</span></div>
    </div>
    <button class="btn alt" id="lvX">Quay lại</button>
    <div id="goBox" hidden><button class="btn" id="goBtn">Quay lại · Chơi game mới</button></div>
  </div>
  <div id="ask" hidden>
    <label for="np">Nhập số người chơi (1–6)</label>
    <input id="np" type="number" min="1" max="6" value="1" inputmode="numeric">
    <button class="btn" id="ok">OK</button>
    <p id="err" role="alert"></p>
    <p class="tip">Nhấn Enter để xác nhận</p>
  </div>
  <div id="chr" hidden>
    <h2 id="chT"></h2>
    <canvas id="pv" width="24" height="30"></canvas>
    <div class="row" id="chS"></div>
    <div class="row"><button class="btn alt" id="chBack">Quay lại</button><button class="btn" id="chOk">Tiếp</button></div>
    <p class="tip">Nhấn Enter để xác nhận</p>
  </div>
  <div id="hud" hidden>
    <div id="topRow">
      <div class="pnl" id="clk"></div>
      <div class="pnl" id="stm" aria-label="Thanh thể lực">
        <div class="bar"><i id="stF"></i></div>
        <span id="stS">Thể lực 100/100</span>
      </div>
    </div>
    <div class="pnl" id="sl"></div>
    <div class="pnl" id="gd"></div>
  </div>
  <div id="tools" hidden><button class="btn alt" id="invBtn">B</button><button class="btn alt" id="hudBtn">H</button><button class="btn" id="rsBtn">Reset</button><button class="btn" id="again">Về màn hình chính</button></div>
  <div id="inv" hidden>
    <h2><span>🎒 Túi đồ <b id="invWho">P1</b></span><span id="invCnt">0/18</span></h2>
    <div id="invGrid" role="list"></div>
    <p id="invInfo">Chọn một ô để xem đồ.</p>
    <div class="row">
      <button class="btn" id="invUse">Dùng</button>
      <button class="btn alt" id="invDrop">Vứt</button>
      <button class="btn alt" id="invX">Đóng (B)</button>
    </div>
  </div>
  <div id="rs" hidden>
    <p>Chọn mốc muốn quay lại:</p>
    <button class="btn" data-r="day"></button>
    <button class="btn" data-r="week"></button>
    <button class="btn" data-r="all"></button>
    <button class="btn alt" id="rsX">Hủy</button>
  </div>
  <div id="meal" hidden><b>🍽 Giờ ăn</b><p id="mT"></p><div id="mO"></div><p class="tip">Còn <b id="mC">15</b> phút nữa bữa ăn bắt đầu.</p></div>
  <div id="tk" hidden>Bấm <b>E</b> để nói chuyện với Chủ đảo</div>
  <div id="dlg" hidden><b id="dN"></b><p id="dT"></p><div id="dO"></div></div>
</div>
</main>
<script src="../js/deadisland.js"></script>
<script src="../js/village.js"></script>
<script src="../js/market.js"></script>
<script src="../js/Playerkit.js"></script>
<script src="../js/item.js"></script>
<script src="../js/ghostplus.js"></script>
<script src="../js/Abyss.js"></script>
<script src="../js/Sentinel.js"></script>
</body></html>
